name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  android-release:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    concurrency:
      group: streamdek-android-release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail

          version_file="android/version.properties"
          if [ ! -f "$version_file" ]; then
            echo "Missing $version_file."
            exit 1
          fi
          committed_version_name="$(sed -n 's/^VERSION_NAME=//p' "$version_file" | tail -n 1)"
          version_code="$(sed -n 's/^VERSION_CODE=//p' "$version_file" | tail -n 1)"

          tag_name="${GITHUB_REF_NAME}"
          if [[ "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version_name="${tag_name#v}"
          else
            version_name="${committed_version_name}"
            tag_name="v${version_name}"
          fi

          if [[ ! "$version_code" =~ ^[1-9][0-9]*$ ]]; then
            echo "VERSION_CODE must be a positive integer."
            exit 1
          fi

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Detect Android project
        id: android
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -f "android/gradlew" ]; then
            project_dir="android"
          else
            project_dir="$(find . -maxdepth 4 -name gradlew -path '*/android/gradlew' -print -quit | sed 's#/gradlew$##')"
          fi

          if [ -z "${project_dir:-}" ] || [ ! -f "$project_dir/gradlew" ]; then
            echo "No Android Gradle project found."
            exit 1
          fi
          chmod +x "$project_dir/gradlew"

          app_dir="$project_dir/app"
          if [ ! -f "$app_dir/build.gradle" ] && [ ! -f "$app_dir/build.gradle.kts" ]; then
            echo "Android app module not found at $app_dir."
            exit 1
          fi

          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "app_dir=$app_dir" >> "$GITHUB_OUTPUT"

      - name: Write CI environment file
        shell: bash
        env:
          STREAMDEK_API_URL_VAR: ${{ vars.STREAMDEK_API_URL }}
          STREAMDEK_API_URL_SECRET: ${{ secrets.STREAMDEK_API_URL }}
          STREAMDEK_PREMIUMIZE_CLIENT_ID_VAR: ${{ vars.STREAMDEK_PREMIUMIZE_CLIENT_ID }}
          STREAMDEK_PREMIUMIZE_CLIENT_ID_SECRET: ${{ secrets.STREAMDEK_PREMIUMIZE_CLIENT_ID }}
          STREAMDEK_CONTENT_POLICY_PUBLIC_KEYS_VAR: ${{ vars.STREAMDEK_CONTENT_POLICY_PUBLIC_KEYS }}
        run: |
          set -Eeuo pipefail

          api_url="${STREAMDEK_API_URL_VAR:-${STREAMDEK_API_URL_SECRET:-https://api.streamdek.net}}"
          premiumize_client_id="${STREAMDEK_PREMIUMIZE_CLIENT_ID_VAR:-${STREAMDEK_PREMIUMIZE_CLIENT_ID_SECRET:-}}"
          content_policy_public_keys="${STREAMDEK_CONTENT_POLICY_PUBLIC_KEYS_VAR:-}"

          printf 'STREAMDEK_API_URL=%s\nSTREAMDEK_PREMIUMIZE_CLIENT_ID=%s\nSTREAMDEK_CONTENT_POLICY_PUBLIC_KEYS=%s\n' "$api_url" "$premiumize_client_id" "$content_policy_public_keys" > .env

      - name: Decode Android keystore
        id: keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          has_custom_keystore="false"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_STORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            if printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${{ steps.android.outputs.app_dir }}/streamdek-release.jks"; then
              has_custom_keystore="true"
              echo "Custom keystore decoded."
            fi
          fi
          if [ "$has_custom_keystore" != "true" ]; then
            echo "No custom release keystore secret configured; building with debug signing."
          fi
          echo "has_keystore=$has_custom_keystore" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.has_keystore == 'true' && 'streamdek-release.jks' || '' }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STREAMDEK_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          STREAMDEK_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -Eeuo pipefail
          ./gradlew --no-daemon clean assembleRelease

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          apk_path="$(find "${{ steps.android.outputs.app_dir }}/build/outputs/apk/release" -name '*.apk' -print -quit)"
          if [ -z "${apk_path:-}" ]; then
            echo "Release APK was not produced."
            exit 1
          fi
          tag_label="${{ steps.version.outputs.tag_name }}"
          release_apk="dist/streamdek-${tag_label}-arm64.apk"
          cp "$apk_path" "$release_apk"
          echo "apk_path=$release_apk" >> "$GITHUB_OUTPUT"
          echo "apk_name=streamdek-${tag_label}-arm64.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamdek-${{ steps.version.outputs.tag_name }}-arm64-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Preserve release crash mappings
        uses: actions/upload-artifact@v4
        with:
          name: streamdek-${{ steps.version.outputs.tag_name }}-${{ github.run_number }}-mapping
          path: android/app/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 30

      - name: Detect custom release notes
        id: release_notes
        shell: bash
        run: |
          set -Eeuo pipefail
          notes_path=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes_path" ]; then
            echo "body_path=$notes_path" >> "$GITHUB_OUTPUT"
            echo "has_custom=true" >> "$GITHUB_OUTPUT"
          else
            echo "body_path=" >> "$GITHUB_OUTPUT"
            echo "has_custom=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk_path }}
          generate_release_notes: true
          fail_on_unmatched_files: false
